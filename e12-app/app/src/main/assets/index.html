<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{font-family:system-ui,Tahoma,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:14px;line-height:1.6}
  h1{font-size:20px;margin:4px 0 10px}
  .card{background:#1e293b;border-radius:12px;padding:14px;margin:12px 0}
  h2{font-size:16px;margin:0 0 8px}
  button{font:inherit;padding:9px 12px;border-radius:9px;border:0;margin:3px 0;background:#22c55e;color:#06210f;font-weight:600}
  button.sec{background:#334155;color:#e2e8f0}
  button:disabled{opacity:.4}
  .dev{display:block;width:100%;text-align:right;background:#334155;color:#e2e8f0}
  .log{font-size:12px;color:#94a3b8;max-height:220px;overflow:auto;direction:rtl}
  .ok{color:#22c55e}.err{color:#f87171}
  #state{font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
  .item{background:#334155;border-radius:10px;overflow:hidden}
  .item img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#0f172a}
  .meta{padding:5px 8px;font-size:11px;display:flex;justify-content:space-between;align-items:center}
  .meta button{padding:4px 8px;font-size:12px;margin:0}
</style>
</head>
<body>
<h1>🎧 سماعة E12</h1>

<div class="card">
  <h2>١) الاتصال</h2>
  <button id="scan">🔍 بحث عن السماعة</button> <span id="state" class="err">غير متصل</span>
  <div id="devs"></div>
</div>

<div class="card">
  <h2>٢) الأوامر</h2>
  <div id="cmds">
    <button data-h="22 30">📸 التقاط صورة</button>
    <button data-h="23 00">⏺️ بدء فيديو</button>
    <button data-h="24 00">⏹️ إيقاف فيديو</button>
    <button data-h="17 00">🔋 البطارية</button>
    <button data-h="48 00">ℹ️ الحالة</button>
    <button data-h="16 00">💾 السعة</button>
  </div>
</div>

<div class="card">
  <h2>٣) الصور</h2>
  <button id="getPhotos">📥 جلب الصور من السماعة</button>
  <button id="wifiOff" class="sec">قطع شبكة السماعة</button>
  <div id="phStatus" class="log"></div>
  <div id="grid" class="grid"></div>
</div>

<div class="card">
  <h2>السجل</h2>
  <div id="log" class="log"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const A=window.Android;
let ready=false, wantPhotos=false, ssidTimer=null, triedAp=false;

function log(m,c){ const d=document.createElement('div'); d.textContent=m; if(c)d.className=c; $('log').prepend(d); }
function ph(m,c){ $('phStatus').innerHTML=''; const d=document.createElement('div'); d.textContent=m; if(c)d.className=c; $('phStatus').appendChild(d); }

const NAMES={0x22:'التقاط صورة',0x23:'بدء فيديو',0x24:'إيقاف فيديو',0x39:'واي فاي',0x16:'السعة',0x17:'البطارية',0x48:'الحالة',
 0x01:'سطوع LED',0x02:'مدة التسجيل',0x04:'كشف الارتداء',0x06:'الأوامر الصوتية',0x07:'سحب أمامي',0x08:'سحب خلفي',0x09:'نقرة',0x10:'نقرتان',0x11:'ثلاث نقرات',0x61:'اتجاه الكاميرا',
 0x25:'شبكة السماعة',0x42:'عدد الصور',0x45:'حالة الجهاز'};

// ===== callbacks from Android =====
window.onLog=m=>log(m);
window.onDevice=(name,addr)=>{
  const b=document.createElement('button'); b.className='dev'; b.textContent=`${name}  (${addr})`;
  b.onclick=()=>A.connect(addr); $('devs').appendChild(b);
  if(/^E12/i.test(name)&&!ready){ A.connect(addr); }
};
window.onState=s=>{
  ready = s==='ready';
  $('state').textContent = ready?'متصل ✅':'غير متصل'; $('state').className = ready?'ok':'err';
  if(ready) $('devs').innerHTML='';
};
window.onSent=h=>log('→ '+h);
window.onNotify=h=>{
  const v=h.split(' ').map(x=>parseInt(x,16));
  if(!((v[0]==0xAC||v[0]==0xAB)&&v[1]==0x55&&v.length>5)) return log('← '+h);
  const cmd=v[4], p=v.slice(5,v.length-1), name=NAMES[cmd]||('0x'+cmd.toString(16));
  const txt=String.fromCharCode(...p).replace(/[^\x20-\x7E]/g,'');
  let val;
  if(cmd==0x17) val=txt+'%';
  else if(cmd==0x02) val=(p[0]<<8|p[1])+' ث';
  else if(cmd==0x25) val=txt;
  else if(p.length==1&&p[0]>=0x30&&p[0]<=0x39) val=String.fromCharCode(p[0]);
  else if(p.length==1) val=p[0]==1?'✅ تم':'رد '+p[0];
  else val=p.map(x=>x.toString(16).padStart(2,'0')).join(' ');
  log(`← ${name}: ${val}`,'ok');
  if(cmd==0x25 && wantPhotos && txt){
    clearTimeout(ssidTimer); wantPhotos=false;
    ph('جارٍ الاتصال بشبكة '+txt+' …');
    A.connectWifi(txt,'12345678');
  }
};
window.onWifi=s=>{
  if(s==='connected'){ ph('متصل بشبكة السماعة ✅ — جارٍ جلب القائمة…','ok'); A.listFiles(); }
  else if(s==='failed') ph('فشل الاتصال بالشبكة. وافق على نافذة الاتصال إن ظهرت ثم أعد المحاولة.','err');
  else if(s==='lost') ph('انقطعت شبكة السماعة','err');
};
window.onFiles=json=>{
  let data; try{ data=JSON.parse(json);}catch(e){ return ph('رد غير مفهوم: '+json,'err'); }
  const files=(data.info||[]).flatMap(f=>f.files||[]).sort((a,b)=>(b.createtimestr||'').localeCompare(a.createtimestr||''));
  ph(`عدد الملفات: ${files.length}`,'ok'); $('grid').innerHTML='';
  files.forEach(f=>{
    const d=document.createElement('div'); d.className='item'; d.dataset.name=f.name;
    const t=f.createtimestr||''; const when=t.length>=12?`${t.slice(6,8)}/${t.slice(4,6)} ${t.slice(8,10)}:${t.slice(10,12)}`:'';
    d.innerHTML=`<img alt=""><div class="meta"><span>${when}</span><button>حفظ</button></div>`;
    d.querySelector('button').onclick=e=>{ e.target.disabled=true; e.target.textContent='…'; A.save(f.name); };
    $('grid').appendChild(d);
  });
  // load thumbnails one by one
  let i=0; const q=files.map(f=>f.name);
  window._thumbNext=()=>{ if(i<q.length) A.thumb(q[i++]); };
  window._thumbNext();
};
window.onThumb=(name,url)=>{
  const it=[...document.querySelectorAll('.item')].find(x=>x.dataset.name===name);
  if(it&&url) it.querySelector('img').src=url;
  window._thumbNext&&window._thumbNext();
};
window.onSaved=(name,ok)=>{
  const it=[...document.querySelectorAll('.item')].find(x=>x.dataset.name===name);
  if(it){ const b=it.querySelector('button'); b.textContent= ok==='1'?'✅ محفوظة':'فشل'; }
};

// ===== UI =====
$('scan').onclick=()=>{ $('devs').innerHTML=''; A.startScan(); };
document.querySelectorAll('#cmds button').forEach(b=>b.onclick=()=>A.send(b.dataset.h));
$('getPhotos').onclick=()=>{
  if(!ready) return ph('اتصل بالسماعة أولاً (القسم ١)','err');
  wantPhotos=true; triedAp=false; ph('جارٍ تشغيل واي فاي السماعة…');
  A.send('39 30');
  ssidTimer=setTimeout(()=>{ if(wantPhotos&&!triedAp){ triedAp=true; A.send('39 31');
    ssidTimer=setTimeout(()=>{ if(wantPhotos){ wantPhotos=false; ph('لم ترد السماعة باسم الشبكة','err'); } },8000); } },8000);
};
$('wifiOff').onclick=()=>{ A.disconnectWifi(); ph('تم قطع شبكة السماعة'); };

if(!A) log('افتح هذه الصفحة من داخل التطبيق','err');
</script>
</body>
</html>
